name: Add Tampermonkey auto-update metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-auto-update.yml'

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add update URLs and bump version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('GranBoard-with-Winmau-Autodarts.user.js')
          text = p.read_text(encoding='utf-8')

          text = text.replace('// @version      3.1.0', '// @version      3.1.1', 1)

          if '// @homepageURL' not in text:
              text = text.replace(
                  '// @author       Dartunity\n',
                  '// @author       Dartunity\n'
                  '// @homepageURL  https://github.com/Dartunity/GranBoard-with-Winmau-Autodarts\n'
                  '// @supportURL   https://github.com/Dartunity/GranBoard-with-Winmau-Autodarts/issues\n'
                  '// @updateURL    https://raw.githubusercontent.com/Dartunity/GranBoard-with-Winmau-Autodarts/main/GranBoard-with-Winmau-Autodarts.user.js\n'
                  '// @downloadURL  https://raw.githubusercontent.com/Dartunity/GranBoard-with-Winmau-Autodarts/main/GranBoard-with-Winmau-Autodarts.user.js\n',
                  1
              )

          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/add-auto-update.yml
          git config user.name 'Dartunity Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add GranBoard-with-Winmau-Autodarts.user.js .github/workflows/add-auto-update.yml
          git commit -m 'Enable automatic Tampermonkey updates (3.1.1)'
          git push
