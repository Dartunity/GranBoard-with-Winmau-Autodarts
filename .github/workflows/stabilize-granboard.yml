name: Stabilize GranBoard userscript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-granboard.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert FAST build to Dartunity 3.1.0 Stable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('GranBoard-with-Winmau-Autodarts.user.js')
          text = p.read_text(encoding='utf-8')

          header_end = text.index('// ==/UserScript==') + len('// ==/UserScript==')
          new_header = '''// ==UserScript==
          // @name         Dartunity GranBoard → Autodarts
          // @namespace    dartunity.granboard.autodarts
          // @version      3.1.0
          // @description  GranBoard → Autodarts via Web Bluetooth – angepasst für das neue Autodarts Play UI
          // @author       Dartunity
          // @match        https://play.autodarts.com/*
          // @match        https://*.autodarts.com/*
          // @run-at       document-end
          // @grant        none
          // ==/UserScript=='''.replace('          //', '//')
          text = new_header + text[header_end:]

          text = text.replace(
              '// 3.0.19: reliability update for the Autodarts Play UI introduced 2026-09.',
              '// 3.1.0 Stable: reliable GranBoard input for the new Autodarts Play UI.'
          )
          text = text.replace('  // ---------- TEMP DIAGNOSTIC COUNTER ----------',
                              '  // ---------- INTERNAL COMMIT/RETRY STATE ----------')

          start = text.find('  function ensureDiagBox() {')
          end = text.find('\n  function diagRx(v) {', start)
          if start != -1 and end != -1:
              text = text[:start] + '''  // Internal reliability counters.\n  // No visible diagnostic overlay in the stable release.\n  function renderDiag() {}\n''' + text[end:]

          text = text.replace('  setTimeout(renderDiag, 500);\n', '')
          text = text.replace(
              'if (el.closest?.("#__gb_diag_box__, #__gb_overlay__, #__gb_tab__")) return false;',
              'if (el.closest?.("#__gb_overlay__, #__gb_tab__")) return false;'
          )

          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/stabilize-granboard.yml
          git config user.name 'Dartunity Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add GranBoard-with-Winmau-Autodarts.user.js .github/workflows/stabilize-granboard.yml
          git commit -m 'Release Dartunity GranBoard Autodarts 3.1.0 Stable'
          git push
